[pytest]
asyncio_mode = auto
# Infra-dependent tests are deselected by default so a bare `pytest
# backend/tests` (and CI) is green without PostgreSQL/Redis or a local
# model runtime. Opt back in with an explicit `-m integration` /
# `-m real_runtime` (a CLI -m overrides this one).
addopts = -m "not integration and not real_runtime"
markers =
    integration: tests requiring PostgreSQL and/or Redis
    real_runtime: tests requiring a configured local open-source model runtime
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
