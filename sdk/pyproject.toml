[project]
name = "agent-observability-sdk"
version = "0.1.0"
description = "Python SDK for the Agent Observability Platform"
requires-python = ">=3.9"
dependencies = ["httpx>=0.26.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_observability*"]
