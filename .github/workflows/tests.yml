name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend + research suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches the repo's development floor (backend/venv is 3.9.6).
          python-version: "3.9"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r research/requirements-analysis.txt
          # Real-agent tool loop; pinned to the locally validated version.
          pip install "langgraph==0.6.11"
      - name: Run test suite
        # pytest.ini deselects integration (PostgreSQL/Redis) and
        # real_runtime (local Ollama) tests by default, so this is the
        # same green suite that runs on a bare developer checkout.
        run: python -m pytest backend/tests -q

  frontend:
    name: frontend suite + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test -- --run
      - name: Production build
        run: npm run build
